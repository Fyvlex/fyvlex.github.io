<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101923">
  <meta name="description" content="Alle Links von FYVLEX – Content, Lifestyle und gemeinsame Momente.">
  <title>FYVLEX — Alle Links</title>
  <style>
    :root {
      --bg: #101923;
      --panel: rgba(28, 41, 55, .82);
      --gold: #C6A477;
      --cream: #F2E9DC;
      --muted: #AAB5C0;
      --line: rgba(198, 164, 119, .24);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--cream);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% -15%, rgba(90, 119, 145, .34), transparent 48%),
        radial-gradient(ellipse at 100% 100%, rgba(198, 164, 119, .09), transparent 38%),
        var(--bg);
      display: grid; place-items: center; padding: 42px 18px;
    }
    .wrap { width: min(100%, 520px); text-align: center; }
    .mark {
      width: 82px; height: 82px; margin: 0 auto 19px; border: 1px solid var(--line);
      border-radius: 25px; display: grid; place-items: center;
      color: var(--gold); font-size: 23px; font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.015));
      box-shadow: 0 18px 55px rgba(0,0,0,.22);
    }
    .eyebrow { color: var(--gold); font-size: 11px; letter-spacing: 4px; font-weight: 700; }
    h1 { margin: 10px 0 8px; font-size: clamp(34px, 8vw, 48px); letter-spacing: 5px; }
    .sub { color: var(--muted); margin: 0 auto 29px; line-height: 1.6; max-width: 360px; font-size: 14px; }
    .links { display: grid; gap: 11px; }
    .link {
      display: flex; align-items: center; gap: 14px; padding: 16px 18px;
      color: var(--cream); text-decoration: none; text-align: left;
      background: var(--panel); border: 1px solid rgba(255,255,255,.075);
      border-radius: 15px; transition: transform .18s ease, border-color .18s ease, background .18s ease;
      backdrop-filter: blur(12px);
    }
    .link:hover { transform: translateY(-2px); border-color: var(--gold); background: rgba(39,54,69,.95); }
    .ico {
      width: 39px; height: 39px; flex: 0 0 39px; border-radius: 12px;
      display: grid; place-items: center; color: var(--gold);
      background: rgba(198,164,119,.11); font-size: 17px; font-weight: 800;
    }
    .label { font-weight: 650; font-size: 15px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .arrow { margin-left: auto; color: var(--gold); font-size: 20px; }
    .footer { margin-top: 31px; color: var(--muted); font-size: 10px; letter-spacing: 3px; }
    .footer strong { display: block; margin-top: 8px; color: var(--gold); font-size: 11px; }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="mark" aria-label="FYVLEX Logo">FY</div>
    <div class="eyebrow">OFFICIAL LINKS</div>
    <h1>FYVLEX</h1>
    <p class="sub">Content, Lifestyle & gemeinsame Abenteuer.<br>Finde mich auf deinen Lieblingsplattformen.</p>

    <nav class="links" aria-label="Social-Media-Links">
      <!-- Ersetze DEINNAME und DEIN_DISCORD_INVITE durch deine echten Links. -->
      <a class="link" href="https://twitch.tv/DEINNAME" target="_blank" rel="noopener noreferrer">
        <span class="ico">T</span><span><span class="label">Twitch</span><span class="hint">Live dabei sein</span></span><span class="arrow">↗</span>
      </a>
      <a class="link" href="https://youtube.com/@DEINNAME" target="_blank" rel="noopener noreferrer">
        <span class="ico">▶</span><span><span class="label">YouTube</span><span class="hint">Videos & Highlights</span></span><span class="arrow">↗</span>
      </a>
      <a class="link" href="https://tiktok.com/@DEINNAME" target="_blank" rel="noopener noreferrer">
        <span class="ico">♪</span><span><span class="label">TikTok</span><span class="hint">Clips & kurze Updates</span></span><span class="arrow">↗</span>
      </a>
      <a class="link" href="https://instagram.com/DEINNAME" target="_blank" rel="noopener noreferrer">
        <span class="ico">◎</span><span><span class="label">Instagram</span><span class="hint">Einblicke & Alltag</span></span><span class="arrow">↗</span>
      </a>
      <a class="link" href="https://discord.gg/DEIN_DISCORD_INVITE" target="_blank" rel="noopener noreferrer">
        <span class="ico">⌁</span><span><span class="label">Discord</span><span class="hint">Werde Teil der Community</span></span><span class="arrow">↗</span>
      </a>
    </nav>

    <footer class="footer">FYVLEX<strong>CREATE YOUR MOMENTS.</strong></footer>
  </main>
</body>
</html>
